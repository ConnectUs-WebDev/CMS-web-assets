  <script>
      function switchTab() {
          const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const tab = urlParams.has("tab") ? urlParams.get("tab") : null;
        
        if(tab != null) {
          let faq_screens = document.getElementsByClassName("faq-screen");
          for (var i = 0; i < faq_screens.length; i++) {
            faq_screens[i].classList.add("hide");
          }
    
          let screen = document.getElementsByClassName(tab);
          for (var i = 0; i < screen.length; i++) {
            screen[i].classList.remove("hide");
          }
          
          let btns = document.getElementsByClassName("pressed");
          for (var i = 0; i < btns.length; i++) {
            btns[i].classList.remove("pressed");
          }
          
          let btn_pressed = document.getElementById(tab);
          btn_pressed.classList.add("pressed");
        }
        
      }
      
      function showFaq(button_pressed) {
      }
      
      const btns = document.getElementsByClassName("faq-btn");
      for (var i = 0; i < btns.length; i++) {
        let btn_id = btns[i].id;
        btns[i].addEventListener("click", () => {
          const params = new URLSearchParams({tab: btn_id});
          window.history.replaceState({}, "", "?" + params.toString());
          switchTab();
        });
      }
      
      document.addEventListener("DOMContentLoaded", switchTab);
    </script>
